[project]
name = "colorado-avalanche-ml"
version = "0.1.0"
description = "Snowpack instability prediction from weather sequences for Colorado avalanche terrain"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "duckdb>=1.1",
    "mlflow>=2.16",
    "shap>=0.46",
    "pandas>=2.2",
    "polars>=1.6",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]
ingestion = [
    "herbie-data>=2024.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
